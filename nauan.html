<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Công Thức · Nhà Văn Hóa Phụ Nữ TP.HCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Cormorant+Upright:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f4ede1;
    --paper-deep: #ebe0cd;
    --ink: #1f1813;
    --ink-soft: #4a3f33;
    --ink-faded: #8a7a66;
    --terracotta: #b14a2a;
    --terracotta-deep: #8a3818;
    --ochre: #c08a2e;
    --leaf: #4a6a3a;
    --rule: #d4c3a3;
    --shadow: rgba(31, 24, 19, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(193, 138, 46, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(177, 74, 42, 0.03) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='5'/%3E%3CfeColorMatrix values='0 0 0 0 0.12 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ====== HEADER / MASTHEAD ====== */
  .masthead {
    text-align: center;
    padding: 60px 24px 40px;
    border-bottom: 1px solid var(--rule);
    position: relative;
    background: linear-gradient(180deg, transparent, rgba(235, 224, 205, 0.3));
  }

  .masthead::before {
    content: '';
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 1px;
    background: var(--terracotta);
  }

  .masthead-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 18px;
  }

  .masthead-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .masthead-title em {
    font-style: italic;
    color: var(--terracotta-deep);
  }

  .masthead-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--ink-soft);
    max-width: 540px;
    margin: 0 auto;
  }

  .masthead-meta {
    margin-top: 24px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faded);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .masthead-meta span {
    display: inline-block;
  }

  .meta-dot {
    width: 4px; height: 4px;
    background: var(--ochre);
    border-radius: 50%;
  }

  /* ====== CONTROLS BAR ====== */
  .controls {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(244, 237, 225, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: all 0.2s;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--terracotta);
    background: #fff;
  }

  .search-box::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faded);
    font-size: 18px;
  }

  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .chip:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ====== MAIN CONTAINER ====== */
  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ====== RECIPE GRID ====== */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
    margin-bottom: 60px;
  }

  .recipe-card {
    background: linear-gradient(180deg, #fbf6ec 0%, var(--paper-deep) 100%);
    border: 1px solid var(--rule);
    padding: 28px 24px 24px;
    cursor: pointer;
    transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: hidden;
    text-align: left;
  }

  .recipe-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(177, 74, 42, 0.04) 100%);
    pointer-events: none;
  }

  .recipe-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px var(--shadow);
    border-color: var(--terracotta);
  }

  .recipe-card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recipe-card-num::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .recipe-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.08;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .recipe-card-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-faded);
    font-size: 15px;
    margin-bottom: 18px;
  }

  .recipe-card-meta {
    display: flex;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
  }

  .recipe-card-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .recipe-card-meta strong {
    color: var(--terracotta-deep);
    font-weight: 600;
  }

  /* ====== EMPTY STATE ====== */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-faded);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
  }

  /* ====== MODAL / RECIPE DETAIL ====== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 24, 19, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    overflow-y: auto;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    max-width: 940px;
    margin: 40px auto;
    background: var(--paper);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
    position: relative;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .modal-backdrop.open .modal {
    transform: translateY(0);
    opacity: 1;
  }

  .modal-close { display: none; } /* thay bằng nút trong .modal-sticky-bar */

  .recipe-header {
    padding: 50px 60px 36px;
    text-align: center;
    border-bottom: 2px solid var(--ink);
    position: relative;
  }

  .recipe-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--terracotta);
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .recipe-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.015em;
  }

  .recipe-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-faded);
    margin-bottom: 22px;
  }

  .recipe-meta {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }

  .recipe-meta span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ====== SERVINGS CONTROL ====== */
  .servings-control {
    background: var(--paper-deep);
    padding: 24px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    border-bottom: 1px solid var(--rule);
  }

  .servings-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .servings-control-buttons {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .servings-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 18px;
    font-family: 'Cormorant Garamond', serif;
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .servings-btn:hover:not(:disabled) {
    background: var(--ink);
    color: var(--paper);
  }

  .servings-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .servings-value {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--terracotta-deep);
    min-width: 60px;
    text-align: center;
  }

  .servings-unit {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* ====== RECIPE CONTENT ====== */
  .recipe-content {
    padding: 48px 60px 60px;
  }

  .recipe-note {
    background: rgba(193, 138, 46, 0.08);
    border-left: 3px solid var(--ochre);
    padding: 14px 18px;
    margin-bottom: 32px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .section-title::before {
    content: '§';
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--ochre);
    font-style: italic;
  }

  /* ====== INGREDIENT GROUPS ====== */
  .ingredient-group {
    margin-bottom: 32px;
  }

  .ingredient-group-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 16px;
    font-style: italic;
  }

  .ingredient-list {
    list-style: none;
  }

  .ingredient {
    display: flex;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px dotted var(--rule);
    gap: 12px;
  }

  .ingredient-name {
    font-size: 15px;
    color: var(--ink);
    flex: 1;
  }

  .ingredient-dots {
    flex: 0 0 auto;
    color: var(--ink-faded);
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: 4px;
    font-size: 10px;
    align-self: end;
    margin-bottom: 4px;
    max-width: 80px;
  }

  .ingredient-qty {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--terracotta-deep);
    text-align: right;
    min-width: 100px;
  }

  .ingredient-qty.scaled {
    color: var(--terracotta);
    font-style: italic;
  }

  .ingredient-note {
    font-size: 12px;
    color: var(--ink-faded);
    font-style: italic;
    display: block;
    margin-top: 2px;
  }

  /* ====== STEPS ====== */
  .steps-section {
    margin-top: 48px;
  }

  .step {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
  }

  .step:last-child {
    border-bottom: none;
  }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 42px;
    font-weight: 500;
    color: var(--ochre);
    line-height: 1;
    text-align: center;
  }

  .step-body {
    padding-top: 4px;
  }

  .step-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .step-time {
    font-family: 'DM Sans', sans-serif;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--leaf);
    background: rgba(74, 106, 58, 0.1);
    padding: 3px 10px;
    border-radius: 2px;
    font-weight: 600;
  }

  .step-content {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-soft);
  }

  /* ====== FOOTER ====== */
  .footer {
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid var(--rule);
    color: var(--ink-faded);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
  }

  /* ====== ANIMATIONS ====== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .recipe-card {
    animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }

  .recipe-card:nth-child(1) { animation-delay: 0.05s; }
  .recipe-card:nth-child(2) { animation-delay: 0.10s; }
  .recipe-card:nth-child(3) { animation-delay: 0.15s; }
  .recipe-card:nth-child(4) { animation-delay: 0.20s; }
  .recipe-card:nth-child(5) { animation-delay: 0.25s; }
  .recipe-card:nth-child(6) { animation-delay: 0.30s; }
  .recipe-card:nth-child(7) { animation-delay: 0.35s; }
  .recipe-card:nth-child(8) { animation-delay: 0.40s; }
  .recipe-card:nth-child(n+9) { animation-delay: 0.45s; }

  /* ====== FAVORITES (HEART BUTTON) ====== */
  .fav-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 20px;
    color: var(--ink-faded);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
  }
  .fav-btn:hover {
    background: rgba(177, 74, 42, 0.08);
    color: var(--terracotta);
  }
  .fav-btn.active {
    color: var(--terracotta);
  }
  .fav-btn.active::before { content: '❤'; }
  .fav-btn:not(.active)::before { content: '♡'; font-weight: 100; }
  .fav-btn:active { transform: scale(0.88); }

  /* ====== MODAL STRUCTURE: STICKY ====== */
  .modal-scroll {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(100vh - 80px);
    scroll-behavior: smooth;
  }
  .modal-sticky-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(244, 237, 225, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 60px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
  }
  .modal-sticky-title {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .modal-scroll.scrolled .modal-sticky-title { opacity: 1; }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .icon-btn.fav.active {
    background: var(--terracotta);
    color: #fff;
    border-color: var(--terracotta);
  }
  .icon-btn:active { transform: scale(0.92); }

  /* ====== TABS ====== */
  .modal-tabs {
    display: flex;
    position: sticky;
    top: 60px;
    z-index: 14;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0 60px;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-faded);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.02em;
  }
  .tab-btn.active {
    color: var(--terracotta-deep);
    border-bottom-color: var(--terracotta);
    font-weight: 600;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.25s ease-out; }
  .print-only-title {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 16px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }
  @media print {
    .print-only-title { display: block !important; }
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 900px) {
    .modal-sticky-bar { padding: 12px 28px; }
    .modal-tabs { padding: 0 28px; }
    .recipe-header { padding-left: 28px; padding-right: 28px; }
    .servings-control { padding-left: 28px; padding-right: 28px; }
    .recipe-content { padding-left: 28px; padding-right: 28px; }
  }

  @media (max-width: 768px) {
    .masthead {
      padding: 32px 20px 24px;
      padding-top: max(32px, env(safe-area-inset-top, 32px));
    }
    .masthead-title { font-size: clamp(40px, 11vw, 60px); }
    .masthead-sub { font-size: 16px; }
    .masthead-meta { font-size: 11px; gap: 12px; }

    .container { padding: 28px 16px 60px; }
    .recipe-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .recipe-card { padding: 22px 20px 20px; }
    .recipe-card-title { font-size: 23px; }

    /* Controls: search alone top row, chips scroll-snap below */
    .controls {
      padding: 10px 0 0;
      gap: 8px;
      flex-direction: column;
      align-items: stretch;

          { name: "Boro (cắt khúc)", qty: 0.2, unit: "kg" },
          { name: "Hành tây (cắt đôi nướng vàng)", qty: 0.2, unit: "kg" },
          { name: "Chanh (cắt miếng)", qty: 0.2, unit: "kg" },
          { name: "Gừng (nướng vàng đập dập)", qty: 0.2, unit: "kg" },
          { name: "Hành tím (nướng thơm lột vỏ đập nhẹ)", qty: 0.1, unit: "kg" },
          { name: "Ngò rí", qty: 50, unit: "gr" },
          { name: "Hành lá", qty: 0.1, unit: "kg" },
          { name: "Huyết gà/heo (trụng nước sôi ngâm nước lạnh)", qty: 0.5, unit: "kg" },
          { name: "Lòng gà / trứng non", qty: null, unit: "vừa đủ" },
          { name: "Mỡ gà (thắng lấy nước cho ít gừng → lượt qua rây)", qty: 300, unit: "gr" },
          { name: "Gia vị: bột ngọt, knor, đường phèn, nước mắm, muối", qty: null, unit: "nêm vừa ăn" },
        ]
      }
    ],
    steps: [
      { title: "Nấu nước dùng", time: "~2 giờ", content: "5-6 lít nước + xương gà + gừng nướng + hành tím nướng + củ cải trắng + hành tây nướng + boro + rễ ngò + khô mực nướng + 1 ms muối → nấu lửa nhỏ 2 giờ, lượt lấy nước dùng trong." },
      { title: "Nấu nước hủ tiếu", content: "Nước dùng trong + 1 vá mỡ gà đã thắng + gia vị (bột ngọt + knor + đường phèn + nước mắm)." },
      { title: "Dọn kèm", content: "Hủ tiếu + lòng gà trứng non + huyết + thịt gà + hành ngò + hành tây thái sợi + giá + chanh ớt + nước mắm mặn." }
    ]
  }
];

</script>
<script>
  console.log('%c[Sổ Công Thức] v2026.05.22-mobile-redesign ✓', 'background:#b14a2a;color:#f4ede1;padding:4px 10px;border-radius:4px;font-weight:bold');

  // ========== STATE ==========
  let activeCategory = 'Tất cả';
  let searchQuery = '';
  let currentRecipe = null;
  let currentServings = 4;
  let currentTab = 'ingredients';

  // Favorites (lưu vào localStorage)
  const FAV_KEY = 'congthuc_favorites_v1';
  let favorites = new Set();
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (raw) favorites = new Set(JSON.parse(raw));
  } catch(e) { console.warn('Không đọc được favorites:', e); }

  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
    catch(e) { console.warn('Không lưu được favorites:', e); }
  }

  function toggleFavorite(id, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveFavorites();
    renderGrid();
    renderChips();
    if (currentRecipe && currentRecipe.id === id) {
      // cập nhật nút trong modal mà không re-render hết (giữ scroll position)
      document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(el => {
        el.classList.toggle('active', favorites.has(id));
      });
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.panel === tab);
    });
  }

  function printRecipe() {
    if (!currentRecipe) return;
    // Đảm bảo cả 2 panels hiện ra khi in (CSS @print đã handle, nhưng để chắc)
    window.print();
  }

  // ========== UTILITIES ==========
  function formatQty(qty, unit, baseServings, currentServings) {
    if (qty === null || qty === undefined) {
      return unit; // "vừa đủ", "nêm vừa ăn"
    }
    const scaled = qty * (currentServings / baseServings);

    // Format number nicely
    let display;
    if (scaled >= 100) {
      display = Math.round(scaled).toString();
    } else if (scaled >= 10) {
      display = (Math.round(scaled * 10) / 10).toString();
    } else if (scaled >= 1) {
      display = (Math.round(scaled * 100) / 100).toString();
    } else {
      // Fractions for small amounts
      display = formatFraction(scaled);
    }

    // Remove trailing zeros
    display = display.replace(/\.?0+$/, '');
    if (display === '' || display === '-') display = '0';

    return `${display} ${unit}`;
  }

  function formatFraction(n) {
    // Common fractions
    if (Math.abs(n - 0.5) < 0.02) return '½';
    if (Math.abs(n - 0.25) < 0.02) return '¼';
    if (Math.abs(n - 0.33) < 0.02) return '⅓';
    if (Math.abs(n - 0.67) < 0.02) return '⅔';
    if (Math.abs(n - 0.75) < 0.02) return '¾';
    if (Math.abs(n - 0.125) < 0.02) return '⅛';
    return (Math.round(n * 100) / 100).toString();
  }

  // ========== RENDER GRID ==========
  const FAV_CATEGORY = '❤️ Đã lưu';

  function getCategories() {
    const cats = ['Tất cả'];
    if (favorites.size > 0) cats.push(FAV_CATEGORY);
    const others = new Set();
    RECIPES.forEach(r => others.add(r.category));
    return cats.concat([...others]);
  }

  function renderChips() {
    const wrap = document.getElementById('filterChips');
    // nếu user đang ở filter favorites nhưng không còn fav nào → quay về Tất cả
    if (activeCategory === FAV_CATEGORY && favorites.size === 0) activeCategory = 'Tất cả';
    wrap.innerHTML = getCategories().map(cat => {
      const count = cat === FAV_CATEGORY ? ` (${favorites.size})` : '';
      return `<button class="chip ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}${count}</button>`;
    }).join('');

    wrap.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        renderChips();
        renderGrid();
        // scroll chip active vào view (mobile horizontal scroll)
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderGrid() {
    const grid = document.getElementById('recipeGrid');
    const filtered = RECIPES.filter(r => {
      const matchCat = activeCategory === 'Tất cả'
        || (activeCategory === FAV_CATEGORY && favorites.has(r.id))
        || r.category === activeCategory;
      const matchSearch = !searchQuery || r.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          (r.subtitle && r.subtitle.toLowerCase().includes(searchQuery.toLowerCase()));
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      const msg = activeCategory === FAV_CATEGORY
        ? 'Chưa có món nào được lưu — bấm trái tim ♡ trên món yêu thích để lưu lại'
        : 'Không tìm thấy món nào…';
      grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">${msg}</div>`;
      return;
    }

    grid.innerHTML = filtered.map(r => {
      const isFav = favorites.has(r.id);
      return `
      <div class="recipe-card" data-id="${r.id}" tabindex="0" role="button">
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav-id="${r.id}" aria-label="${isFav ? 'Bỏ lưu' : 'Lưu món'}" title="${isFav ? 'Bỏ lưu' : 'Lưu món'}"></button>
        <div class="recipe-card-num">№ ${String(r.id).padStart(2, '0')}</div>
        <h3 class="recipe-card-title">${r.title}</h3>
        ${r.subtitle ? `<div class="recipe-card-sub">${r.subtitle}</div>` : ''}
        <div class="recipe-card-meta">
          <span><strong>${r.servings}</strong> người</span>
          <span>${r.category}</span>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.recipe-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('.fav-btn')) return;
        openModal(parseInt(card.dataset.id));
      });
      card.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.fav-btn')) {
          e.preventDefault();
          openModal(parseInt(card.dataset.id));
        }
      });
    });
    grid.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', e => toggleFavorite(parseInt(btn.dataset.favId), e));
    });
  }

  // ========== MODAL ==========
  function openModal(id) {
    currentRecipe = RECIPES.find(r => r.id === id);
    if (!currentRecipe) return;
    currentServings = currentRecipe.servings;
    currentTab = 'ingredients';
    renderModal();
    document.getElementById('modalBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
    currentRecipe = null;
  }

  function adjustServings(delta) {
    const next = currentServings + delta;
    if (next < 1 || next > 30) return;
    currentServings = next;
    // chỉ re-render phần nguyên liệu để giữ scroll position
    const ingredientsPanel = document.querySelector('.tab-panel[data-panel="ingredients"]');
    if (ingredientsPanel) {
      ingredientsPanel.innerHTML = renderIngredients(currentRecipe);
    }
    // cập nhật servings value + unit
    const sv = document.querySelector('.servings-value');
    const su = document.querySelector('.servings-unit');
    if (sv) sv.textContent = currentServings;
    if (su) su.textContent = currentServings !== currentRecipe.servings
      ? `người (gốc: ${currentRecipe.servings})` : 'người';
    // cập nhật disabled
    document.querySelectorAll('.servings-btn').forEach((b, i) => {
      b.disabled = (i === 0 && currentServings <= 1) || (i === 1 && currentServings >= 30);
    });
  }

  function renderIngredients(r) {
    const isScaled = currentServings !== r.servings;
    if (r.note) {
      return `<div class="recipe-note">${r.note}</div>` + r.groups.map(g => `
        <div class="ingredient-group">
          ${r.groups.length > 1 ? `<h3 class="ingredient-group-name">${g.name}</h3>` : ''}
          <ul class="ingredient-list">
            ${g.items.map(item => `
              <li class="ingredient">
                <span class="ingredient-name">
                  ${item.name}
                  ${item.note ? `<span class="ingredient-note">(${item.note})</span>` : ''}
                </span>
                <span class="ingredient-qty ${isScaled && item.qty !== null ? 'scaled' : ''}">
                  ${formatQty(item.qty, item.unit, r.servings, currentServings)}
                </span>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
    }
    return r.groups.map(g => `
      <div class="ingredient-group">
        ${r.groups.length > 1 ? `<h3 class="ingredient-group-name">${g.name}</h3>` : ''}
        <ul class="ingredient-list">
          ${g.items.map(item => `
            <li class="ingredient">
              <span class="ingredient-name">
                ${item.name}
                ${item.note ? `<span class="ingredient-note">(${item.note})</span>` : ''}
              </span>
              <span class="ingredient-qty ${isScaled && item.qty !== null ? 'scaled' : ''}">
                ${formatQty(item.qty, item.unit, r.servings, currentServings)}
              </span>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');
  }

  function renderSteps(r) {
    return r.steps.map((s, i) => `
      <div class="step">
        <div class="step-num">${String(i + 1).padStart(2, '0')}</div>
        <div class="step-body">
          <h4 class="step-title">
            ${s.title}
            ${s.time ? `<span class="step-time">${s.time}</span>` : ''}
          </h4>
          <p class="step-content">${s.content}</p>
        </div>
      </div>
    `).join('');
  }

  function renderModal() {
    const r = currentRecipe;
    const isScaled = currentServings !== r.servings;
    const isFav = favorites.has(r.id);
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <div class="modal-sticky-bar">
        <button class="icon-btn" onclick="closeModal()" aria-label="Đóng" title="Đóng">←</button>
        <h3 class="modal-sticky-title">${r.title}</h3>
        <div class="modal-actions">
          <button class="icon-btn fav ${isFav ? 'active' : ''}" data-fav-id="${r.id}" onclick="toggleFavorite(${r.id}, event)" aria-label="${isFav ? 'Bỏ lưu' : 'Lưu món'}" title="${isFav ? 'Bỏ lưu' : 'Lưu món'}">${isFav ? '❤' : '♡'}</button>
          <button class="icon-btn" onclick="printRecipe()" aria-label="In công thức" title="In công thức">⎙</button>
        </div>
      </div>

      <header class="recipe-header">
        <div class="recipe-num">№ ${String(r.id).padStart(2, '0')} · ${r.category}</div>
        <h2 class="recipe-title">${r.title}</h2>
        ${r.subtitle ? `<div class="recipe-subtitle">${r.subtitle}</div>` : ''}
        <div class="recipe-meta">
          <span>Nguồn · ${r.source}</span>
          <span>${r.groups.length} phần nguyên liệu</span>
          <span>${r.steps.length} bước</span>
        </div>
      </header>

      <div class="servings-control">
        <span class="servings-label">Khẩu phần cho</span>
        <div class="servings-control-buttons">
          <button class="servings-btn" onclick="adjustServings(-1)" ${currentServings <= 1 ? 'disabled' : ''}>−</button>
          <div class="servings-value">${currentServings}</div>
          <button class="servings-btn" onclick="adjustServings(1)" ${currentServings >= 30 ? 'disabled' : ''}>+</button>
        </div>
        <span class="servings-unit">${isScaled ? `người (gốc: ${r.servings})` : 'người'}</span>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn ${currentTab === 'ingredients' ? 'active' : ''}" data-tab="ingredients" onclick="switchTab('ingredients')">Nguyên liệu</button>
        <button class="tab-btn ${currentTab === 'steps' ? 'active' : ''}" data-tab="steps" onclick="switchTab('steps')">Cách làm</button>
      </div>

      <div class="recipe-content">
        <div class="tab-panel ${currentTab === 'ingredients' ? 'active' : ''}" data-panel="ingredients">
          <h2 class="print-only-title">Nguyên liệu</h2>
          ${renderIngredients(r)}
        </div>
        <div class="tab-panel ${currentTab === 'steps' ? 'active' : ''}" data-panel="steps">
          <h2 class="print-only-title">Cách làm</h2>
          ${renderSteps(r)}
        </div>
      </div>
    `;

    // Scroll modal to top + bind scroll listener for sticky title fade
    const scrollEl = document.getElementById('modalContent');
    scrollEl.scrollTop = 0;
    scrollEl.classList.remove('scrolled');
    scrollEl.onscroll = () => {
      scrollEl.classList.toggle('scrolled', scrollEl.scrollTop > 80);
    };
  }

  // ========== EVENT HANDLERS ==========
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderGrid();
  });

  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ========== INIT ==========
  renderChips();
  renderGrid();
</script>
</body>
</html>
