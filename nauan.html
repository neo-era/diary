<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Công Thức · Nhà Văn Hóa Phụ Nữ TP.HCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Cormorant+Upright:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f4ede1;
    --paper-deep: #ebe0cd;
    --ink: #1f1813;
    --ink-soft: #4a3f33;
    --ink-faded: #8a7a66;
    --terracotta: #b14a2a;
    --terracotta-deep: #8a3818;
    --ochre: #c08a2e;
    --leaf: #4a6a3a;
    --rule: #d4c3a3;
    --shadow: rgba(31, 24, 19, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(193, 138, 46, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(177, 74, 42, 0.03) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='5'/%3E%3CfeColorMatrix values='0 0 0 0 0.12 0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ====== HEADER / MASTHEAD ====== */
  .masthead {
    text-align: center;
    padding: 60px 24px 40px;
    border-bottom: 1px solid var(--rule);
    position: relative;
    background: linear-gradient(180deg, transparent, rgba(235, 224, 205, 0.3));
  }

  .masthead::before {
    content: '';
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 1px;
    background: var(--terracotta);
  }

  .masthead-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 18px;
  }

  .masthead-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .masthead-title em {
    font-style: italic;
    color: var(--terracotta-deep);
  }

  .masthead-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--ink-soft);
    max-width: 540px;
    margin: 0 auto;
  }

  .masthead-meta {
    margin-top: 24px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faded);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .masthead-meta span {
    display: inline-block;
  }

  .meta-dot {
    width: 4px; height: 4px;
    background: var(--ochre);
    border-radius: 50%;
  }

  /* ====== CONTROLS BAR ====== */
  .controls {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(244, 237, 225, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: all 0.2s;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--terracotta);
    background: #fff;
  }

  .search-box::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faded);
    font-size: 18px;
  }

  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .chip:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ====== HAMBURGER + SIDEBAR ====== */
  .hamburger {
    width: 44px;
    height: 44px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 2px;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .hamburger:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .hamburger:active { transform: scale(0.94); }
  .hamburger svg { width: 18px; height: 18px; }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 24, 19, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    z-index: 90;
    transition: opacity 0.3s;
  }
  .sidebar-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 340px;
    max-width: 86vw;
    background: var(--paper);
    z-index: 95;
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 30px rgba(31, 24, 19, 0.18);
    padding-top: env(safe-area-inset-top, 0);
    padding-left: env(safe-area-inset-left, 0);
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-header {
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .sidebar-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sidebar-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.1;
  }
  .sidebar-close {
    width: 36px; height: 36px;
    border: 1px solid var(--rule);
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--ink);
    font-size: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s;
  }
  .sidebar-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .sidebar-menu {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 8px 24px;
  }
  .sidebar-item {
    width: 100%;
    padding: 11px 16px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-radius: 2px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .sidebar-item:hover { background: rgba(177, 74, 42, 0.06); }
  .sidebar-item.active {
    background: var(--paper-deep);
    color: var(--terracotta-deep);
    font-weight: 600;
  }
  .sidebar-item-roman {
    font-style: italic;
    color: var(--ochre);
    min-width: 32px;
    font-size: 16px;
    font-weight: 500;
  }
  .sidebar-item-name { flex: 1; }
  .sidebar-item-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .sidebar-divider {
    height: 1px;
    background: var(--rule);
    margin: 10px 16px;
  }
  .sidebar-section-label {
    padding: 12px 16px 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-faded);
    font-weight: 600;
  }

  /* ====== SECTION HEADERS IN MAIN GRID ====== */
  .recipe-section {
    margin-bottom: 56px;
    scroll-margin-top: 90px;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
  }
  .section-roman {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 30px;
    color: var(--terracotta);
    font-weight: 500;
    line-height: 1;
    min-width: 48px;
  }
  .section-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    flex: 1;
    line-height: 1.1;
    color: var(--ink);
  }
  .section-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faded);
    font-weight: 500;
  }
  .section-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
  }

  /* ====== MAIN CONTAINER ====== */
  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ====== RECIPE GRID ====== */
  .recipe-grid {
    margin-bottom: 60px;
  }

  .recipe-card {
    background: linear-gradient(180deg, #fbf6ec 0%, var(--paper-deep) 100%);
    border: 1px solid var(--rule);
    padding: 22px 24px 22px 54px;
    cursor: pointer;
    transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: hidden;
    text-align: left;
  }

  .recipe-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(177, 74, 42, 0.04) 100%);
    pointer-events: none;
  }

  .recipe-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px var(--shadow);
    border-color: var(--terracotta);
  }

  .recipe-card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recipe-card-num::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .recipe-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.08;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .recipe-card-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-faded);
    font-size: 15px;
    margin-bottom: 6px;
  }
  .recipe-card-author {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--terracotta);
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }
  .recipe-card-author::before { content: '~ '; opacity: 0.5; }

  .recipe-card-meta {
    display: flex;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-top: 14px;
    border-top: 1px dashed var(--rule);
  }

  .recipe-card-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .recipe-card-meta strong {
    color: var(--terracotta-deep);
    font-weight: 600;
  }

  /* ====== EMPTY STATE ====== */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-faded);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
  }

  /* ====== MODAL / RECIPE DETAIL ====== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(31, 24, 19, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    overflow-y: auto;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    max-width: 940px;
    margin: 40px auto;
    background: var(--paper);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
    position: relative;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .modal-backdrop.open .modal {
    transform: translateY(0);
    opacity: 1;
  }

  .modal-close { display: none; } /* thay bằng nút trong .modal-sticky-bar */

  .recipe-header {
    padding: 50px 60px 36px;
    text-align: center;
    border-bottom: 2px solid var(--ink);
    position: relative;
  }

  .recipe-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--terracotta);
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .recipe-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.015em;
  }

  .recipe-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-faded);
    margin-bottom: 14px;
  }
  .recipe-author {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--terracotta);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .recipe-author::before { content: '— '; opacity: 0.6; }
  .recipe-author::after { content: ' —'; opacity: 0.6; }

  .recipe-meta {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }

  .recipe-meta span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ====== SERVINGS CONTROL ====== */
  .servings-control {
    background: var(--paper-deep);
    padding: 24px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    border-bottom: 1px solid var(--rule);
  }

  .servings-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .servings-control-buttons {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .servings-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 18px;
    font-family: 'Cormorant Garamond', serif;
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .servings-btn:hover:not(:disabled) {
    background: var(--ink);
    color: var(--paper);
  }

  .servings-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .servings-value {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--terracotta-deep);
    min-width: 60px;
    text-align: center;
  }

  .servings-unit {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* ====== RECIPE CONTENT ====== */
  .recipe-content {
    padding: 48px 60px 60px;
  }

  .recipe-note {
    background: rgba(193, 138, 46, 0.08);
    border-left: 3px solid var(--ochre);
    padding: 14px 18px;
    margin-bottom: 32px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .section-title::before {
    content: '§';
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--ochre);
    font-style: italic;
  }

  /* ====== INGREDIENT GROUPS ====== */
  .ingredient-group {
    margin-bottom: 32px;
  }

  .ingredient-group-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 16px;
    font-style: italic;
  }

  .ingredient-list {
    list-style: none;
  }

  .ingredient {
    display: flex;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px dotted var(--rule);
    gap: 12px;
  }

  .ingredient-name {
    font-size: 15px;
    color: var(--ink);
    flex: 1;
  }

  .ingredient-dots {
    flex: 0 0 auto;
    color: var(--ink-faded);
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: 4px;
    font-size: 10px;
    align-self: end;
    margin-bottom: 4px;
    max-width: 80px;
  }

  .ingredient-qty {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--terracotta-deep);
    text-align: right;
    min-width: 100px;
  }

  .ingredient-qty.scaled {
    color: var(--terracotta);
    font-style: italic;
  }

  .ingredient-note {
    font-size: 12px;
    color: var(--ink-faded);
    font-style: italic;
    display: block;
    margin-top: 2px;
  }

  /* ====== STEPS ====== */
  .steps-section {
    margin-top: 48px;
  }

  .step {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
  }

  .step:last-child {
    border-bottom: none;
  }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 42px;
    font-weight: 500;
    color: var(--ochre);
    line-height: 1;
    text-align: center;
  }

  .step-body {
    padding-top: 4px;
  }

  .step-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .step-time {
    font-family: 'DM Sans', sans-serif;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--leaf);
    background: rgba(74, 106, 58, 0.1);
    padding: 3px 10px;
    border-radius: 2px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .step-time.has-timer {
    cursor: pointer;
    user-select: none;
  }
  .step-time.has-timer::before {
    content: '⏱ ';
    margin-right: 2px;
  }
  .step-time.has-timer:hover {
    background: rgba(74, 106, 58, 0.22);
    color: var(--ink);
  }
  .step-time.has-timer.active {
    background: var(--leaf);
    color: var(--paper);
  }

  /* ===== STEP TIMER PANEL ===== */
  .step-timer {
    display: none;
    margin-top: 12px;
    padding: 12px 16px;
    background: var(--paper-deep);
    border-left: 3px solid var(--leaf);
    border-radius: 2px;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .step-timer.open { display: flex; }
  .step-timer-display {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--terracotta-deep);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    min-width: 100px;
  }
  .step-timer.running .step-timer-display { color: var(--leaf); }
  .step-timer.done .step-timer-display {
    color: var(--terracotta);
    animation: timerPulse 0.6s infinite alternate;
  }
  @keyframes timerPulse {
    from { opacity: 0.55; transform: scale(1); }
    to { opacity: 1; transform: scale(1.05); }
  }
  .step-timer-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 7px 14px;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }
  .step-timer-btn:hover { background: var(--terracotta); }
  .step-timer-btn.reset {
    background: transparent;
    color: var(--ink-faded);
    border: 1px solid var(--rule);
  }
  .step-timer-btn.reset:hover {
    color: var(--ink);
    border-color: var(--ink);
    background: transparent;
  }
  .step-timer-add {
    background: transparent;
    color: var(--ink-faded);
    border: 1px dashed var(--rule);
    padding: 6px 10px;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    cursor: pointer;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .step-timer-add:hover { color: var(--ink); border-color: var(--ink); }

  .step-content {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-soft);
  }

  /* ====== FOOTER ====== */
  .footer {
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid var(--rule);
    color: var(--ink-faded);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
  }

  /* ====== ANIMATIONS ====== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .recipe-card {
    animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }

  .recipe-card:nth-child(1) { animation-delay: 0.05s; }
  .recipe-card:nth-child(2) { animation-delay: 0.10s; }
  .recipe-card:nth-child(3) { animation-delay: 0.15s; }
  .recipe-card:nth-child(4) { animation-delay: 0.20s; }
  .recipe-card:nth-child(5) { animation-delay: 0.25s; }
  .recipe-card:nth-child(6) { animation-delay: 0.30s; }
  .recipe-card:nth-child(7) { animation-delay: 0.35s; }
  .recipe-card:nth-child(8) { animation-delay: 0.40s; }
  .recipe-card:nth-child(n+9) { animation-delay: 0.45s; }

  /* ====== SELECT BUTTON (FOR SHOPPING LIST) ====== */
  .select-btn {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--rule);
    background: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
  }
  .select-btn::before { content: '✓'; font-weight: 700; }
  .select-btn:hover {
    border-color: var(--terracotta);
    background: #fff;
  }
  .select-btn.active {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }
  .select-btn:active { transform: scale(0.88); }

  .recipe-card.selected {
    border-color: var(--terracotta);
    box-shadow: 0 0 0 1px var(--terracotta), 0 8px 22px var(--shadow);
  }
  .recipe-card.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(177, 74, 42, 0.04);
    pointer-events: none;
  }

  /* ====== SHOPPING BAR (FLOATING BOTTOM) ====== */
  .shopping-bar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--terracotta);
    color: #fff;
    padding: 14px 26px 14px 18px;
    border-radius: 100px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 14px 36px rgba(31, 24, 19, 0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 80;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
    border: none;
    letter-spacing: 0.01em;
    padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
  }
  .shopping-bar.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .shopping-bar:hover {
    background: var(--terracotta-deep);
    transform: translateX(-50%) translateY(-2px);
  }
  .shopping-bar:active { transform: translateX(-50%) translateY(0); }
  .shopping-bar-count {
    background: #fff;
    color: var(--terracotta);
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 0 8px;
  }
  .shopping-bar-arrow {
    font-size: 18px;
    margin-left: 4px;
    opacity: 0.8;
  }

  /* ====== SHOPPING LIST CONTENT IN MODAL ====== */
  .shopping-summary {
    background: var(--paper-deep);
    padding: 14px 18px;
    border-radius: 4px;
    margin-bottom: 24px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .shopping-summary-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .shopping-summary ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .shopping-summary li {
    padding: 4px 0;
    padding-left: 20px;
    position: relative;
    font-style: italic;
  }
  .shopping-summary li::before {
    content: '·';
    position: absolute;
    left: 8px;
    color: var(--terracotta);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
  }
  .shopping-source-list {
    font-size: 12px;
    color: var(--ink-faded);
    font-style: italic;
    display: block;
    margin-top: 2px;
  }
  .clear-selection-btn {
    margin-top: 32px;
    padding: 12px 22px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .clear-selection-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ====== FAVORITES (HEART BUTTON) ====== */
  .fav-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 20px;
    color: var(--ink-faded);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
  }
  .fav-btn:hover {
    background: rgba(177, 74, 42, 0.08);
    color: var(--terracotta);
  }
  .fav-btn.active {
    color: var(--terracotta);
  }
  .fav-btn.active::before { content: '❤'; }
  .fav-btn:not(.active)::before { content: '♡'; font-weight: 100; }
  .fav-btn:active { transform: scale(0.88); }

  /* ====== MODAL STRUCTURE: STICKY ====== */
  .modal-scroll {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(100vh - 80px);
    scroll-behavior: smooth;
  }
  .modal-sticky-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(244, 237, 225, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 60px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
  }
  .modal-sticky-title {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .modal-scroll.scrolled .modal-sticky-title { opacity: 1; }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--rule);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .icon-btn.fav.active {
    background: var(--terracotta);
    color: #fff;
    border-color: var(--terracotta);
  }
  .icon-btn:active { transform: scale(0.92); }

  /* ====== TABS ====== */
  .modal-tabs {
    display: flex;
    position: sticky;
    top: 60px;
    z-index: 14;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0 60px;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-faded);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.02em;
  }
  .tab-btn.active {
    color: var(--terracotta-deep);
    border-bottom-color: var(--terracotta);
    font-weight: 600;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.25s ease-out; }
  .print-only-title {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 16px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }
  /* ====== RESPONSIVE ====== */
  @media (max-width: 900px) {
    .modal-sticky-bar { padding: 12px 28px; }
    .modal-tabs { padding: 0 28px; }
    .recipe-header { padding-left: 28px; padding-right: 28px; }
    .servings-control { padding-left: 28px; padding-right: 28px; }
    .recipe-content { padding-left: 28px; padding-right: 28px; }
  }

  @media (max-width: 768px) {
    .masthead {
      padding: 32px 20px 24px;
      padding-top: max(32px, env(safe-area-inset-top, 32px));
    }
    .masthead-title { font-size: clamp(40px, 11vw, 60px); }
    .masthead-sub { font-size: 16px; }
    .masthead-meta { font-size: 11px; gap: 12px; }

    .container { padding: 28px 16px 60px; }
    .recipe-section { margin-bottom: 40px; scroll-margin-top: 80px; }
    .section-header { gap: 12px; margin-bottom: 18px; padding-bottom: 10px; }
    .section-roman { font-size: 24px; min-width: 36px; }
    .section-name { font-size: 22px; }
    .section-count { font-size: 10px; }
    .section-cards {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .recipe-card { padding: 20px 20px 18px 48px; }
    .select-btn { top: 12px; left: 12px; width: 26px; height: 26px; }
    .fav-btn { top: 11px; right: 11px; width: 32px; height: 32px; font-size: 18px; }
    .shopping-bar { padding: 12px 22px 12px 16px; font-size: 15px; bottom: 14px; }
    .shopping-bar-count { min-width: 24px; height: 24px; font-size: 12px; }
    .hamburger { width: 40px; height: 40px; }
    .sidebar { width: 300px; }
    .sidebar-header { padding: 18px 20px 12px; padding-top: max(18px, env(safe-area-inset-top, 18px)); }
    .sidebar-title { font-size: 22px; }
    .sidebar-item { padding: 10px 14px; font-size: 16px; }
    .recipe-card-title { font-size: 23px; }

    /* Controls: hamburger + search một hàng */
    .controls {
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top, 10px));
      gap: 8px;
      flex-wrap: nowrap;
    }
    .search-box {
      flex: 1;
      min-width: 0;
    }
    .search-box input { padding: 11px 14px 11px 40px; font-size: 15px; }

    /* Modal: bottom-sheet style */
    .modal-backdrop {
      align-items: flex-end;
      display: flex;
      padding: 0;
    }
    .modal {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      opacity: 1;
      border-radius: 0;
    }
    .modal-backdrop.open .modal {
      transform: translateY(0);
    }
    .modal-scroll {
      flex: 1;
      max-height: none;
      overflow-y: auto;
    }
    .modal-close { display: none; } /* dùng icon trong sticky bar thay */

    .modal-sticky-bar {
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top, 10px));
      min-height: 56px;
    }
    .modal-tabs {
      padding: 0 16px;
      top: 56px;
    }

    .recipe-header { padding: 28px 20px 22px; }
    .recipe-title { font-size: clamp(28px, 8vw, 38px); }
    .recipe-subtitle { font-size: 18px; margin-bottom: 16px; }
    .recipe-meta {
      gap: 8px 16px;
      font-size: 10px;
    }
    .recipe-num { font-size: 12px; margin-bottom: 10px; }

    .servings-control {
      padding: 14px 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .servings-value { font-size: 26px; min-width: 44px; }
    .servings-label { font-size: 16px; }
    .servings-unit { font-size: 14px; }
    .servings-btn { width: 36px; height: 36px; font-size: 16px; }

    .recipe-content { padding: 28px 20px 40px; }

    .ingredient-group-name { font-size: 19px; margin-bottom: 12px; }
    .ingredient {
      flex-wrap: wrap;
      padding: 10px 0;
      gap: 6px 12px;
    }
    .ingredient-name { font-size: 14px; flex: 1 1 200px; }
    .ingredient-qty {
      font-size: 15px;
      min-width: auto;
      flex-shrink: 0;
    }
    .ingredient-dots { display: none; }

    .step {
      grid-template-columns: 36px 1fr;
      gap: 14px;
      padding: 18px 0;
    }
    .step-num { font-size: 30px; }
    .step-title { font-size: 18px; }
    .step-content { font-size: 14px; }
  }

  @media (max-width: 420px) {
    .masthead { padding: 24px 14px 20px; }
    .masthead-eyebrow { font-size: 10px; margin-bottom: 10px; letter-spacing: 0.28em; }
    .masthead-title { font-size: 36px; }
    .masthead-sub { font-size: 15px; }
    .masthead-meta { font-size: 10px; gap: 10px; flex-wrap: wrap; }

    .container { padding: 20px 12px 40px; }
    .recipe-card { padding: 20px 18px 18px; }
    .recipe-card-title { font-size: 22px; }
    .recipe-card-num { font-size: 12px; margin-bottom: 10px; }
    .recipe-card-sub { font-size: 14px; margin-bottom: 14px; }
    .recipe-card-meta { font-size: 10px; gap: 12px; padding-top: 12px; }

    .recipe-header { padding: 24px 16px 20px; }
    .recipe-content { padding: 24px 16px 36px; }
    .servings-control { padding-left: 16px; padding-right: 16px; }
    .modal-sticky-bar { padding-left: 12px; padding-right: 12px; }
    .modal-tabs.show { padding: 0 12px; }
  }

  /* Touch devices: disable hover effects */
  @media (hover: none) {
    .recipe-card:hover {
      transform: none;
      box-shadow: 0 4px 10px var(--shadow);
      border-color: var(--rule);
    }
    .recipe-card:active {
      transform: scale(0.98);
      border-color: var(--terracotta);
    }
    .chip:hover {
      border-color: var(--rule);
      color: var(--ink-soft);
    }
    .icon-btn:hover {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--rule);
    }
    .fav-btn:hover { background: transparent; color: var(--ink-faded); }
    .fav-btn.active:hover { color: var(--terracotta); }
  }

  /* ====== PRINT (A4) ====== */
  @media print {
    @page {
      size: A4 portrait;
      margin: 1.6cm 1.8cm 1.8cm 1.8cm;
    }

    html, body {
      background: #fff !important;
      background-image: none !important;
      color: #000 !important;
      font-family: 'Cormorant Garamond', 'Times New Roman', serif !important;
      font-size: 11pt;
      line-height: 1.5;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Ẩn toàn bộ UI chrome */
    .masthead, .controls, .hamburger, .sidebar, .sidebar-backdrop,
    .footer, .modal-close, .modal-sticky-bar, .modal-tabs,
    .fav-btn, .select-btn, .icon-btn, .recipe-grid, .servings-btn,
    .ingredient-dots, .shopping-bar, .clear-selection-btn {
      display: none !important;
    }

    /* Shopping summary trong danh sách đi chợ */
    .shopping-summary {
      background: transparent !important;
      border: 1pt solid #888 !important;
      padding: 8pt 12pt !important;
      margin-bottom: 14pt !important;
      page-break-inside: avoid !important;
    }
    .shopping-summary-label {
      font-size: 9pt !important;
      letter-spacing: 0.22em !important;
      color: #000 !important;
      margin-bottom: 4pt !important;
    }
    .shopping-summary li {
      font-size: 11pt !important;
      color: #000 !important;
      padding: 2pt 0 2pt 16pt !important;
    }
    .shopping-source-list {
      font-size: 9pt !important;
      color: #555 !important;
    }

    /* Modal trở thành toàn trang in */
    .modal-backdrop {
      position: static !important;
      background: #fff !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      overflow: visible !important;
      display: block !important;
      inset: auto !important;
    }
    .modal {
      box-shadow: none !important;
      margin: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
      max-height: none !important;
      min-height: 0 !important;
      transform: none !important;
      opacity: 1 !important;
      background: #fff !important;
      border: none !important;
      display: block !important;
    }
    .modal-scroll {
      max-height: none !important;
      overflow: visible !important;
      display: block !important;
    }

    /* TIÊU ĐỀ MÓN */
    .recipe-header {
      background: transparent !important;
      border-bottom: 2pt solid #000 !important;
      padding: 0 0 10pt 0 !important;
      margin: 0 0 14pt 0 !important;
      text-align: center !important;
      page-break-after: avoid !important;
      break-after: avoid !important;
    }
    .recipe-num {
      font-family: 'Cormorant Garamond', serif !important;
      font-style: italic !important;
      font-size: 10pt !important;
      letter-spacing: 0.22em !important;
      color: #000 !important;
      margin-bottom: 6pt !important;
      text-transform: uppercase;
    }
    .recipe-title {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 26pt !important;
      font-weight: 500 !important;
      line-height: 1.05 !important;
      letter-spacing: -0.01em;
      margin: 0 0 4pt 0 !important;
      color: #000 !important;
    }
    .recipe-subtitle {
      font-family: 'Cormorant Garamond', serif !important;
      font-style: italic !important;
      font-size: 13pt !important;
      color: #444 !important;
      margin: 0 0 6pt 0 !important;
    }
    .recipe-author {
      font-family: 'Cormorant Garamond', serif !important;
      font-style: italic !important;
      font-size: 10pt !important;
      color: #555 !important;
      margin: 0 0 10pt 0 !important;
      letter-spacing: 0.05em !important;
    }
    .recipe-author::before, .recipe-author::after { content: ''; }
    .recipe-card-author { display: none !important; }
    .recipe-meta {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 9.5pt !important;
      color: #333 !important;
      gap: 12pt !important;
      letter-spacing: 0.1em !important;
      text-transform: none !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
    }

    /* KHẨU PHẦN: hiện text, ẩn nút +/− */
    .servings-control {

      { title: "Pha nước chấm tương", time: "~5 phút", content: "Phi tỏi với 1 ms dầu cho thơm vàng. Cho tương đen vào đảo đều. Thêm đường + nước dừa + nước cốt me. Đun lửa nhỏ 5 phút khuấy đều cho sánh sệt. Tắt bếp." },

  },

<script>
  console.log('%c[Sổ Công Thức] v2026.05.26-84recipes+timer-loop ✓', 'background:#b14a2a;color:#f4ede1;padding:4px 10px;border-radius:4px;font-weight:bold');

  // ========== STATE ==========
  // activeCategory: 'all' | 'favorites'
  let activeCategory = 'all';
  let searchQuery = '';
  let currentRecipe = null;
  let currentServings = 4;
  let currentTab = 'ingredients';

  // Favorites (lưu vào localStorage)
  const FAV_KEY = 'congthuc_favorites_v1';
  let favorites = new Set();
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (raw) favorites = new Set(JSON.parse(raw));
  } catch(e) { console.warn('Không đọc được favorites:', e); }

  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
    catch(e) { console.warn('Không lưu được favorites:', e); }
  }

  // Selected for shopping list (lưu vào localStorage)
  const SELECT_KEY = 'congthuc_selected_v1';
  let selectedRecipes = new Set();
  let inShoppingMode = false; // true khi đang xem modal danh sách đi chợ
  try {
    const raw = localStorage.getItem(SELECT_KEY);
    if (raw) selectedRecipes = new Set(JSON.parse(raw));
  } catch(e) { console.warn('Không đọc được selected:', e); }

  function saveSelected() {
    try { localStorage.setItem(SELECT_KEY, JSON.stringify([...selectedRecipes])); }
    catch(e) { console.warn('Không lưu được selected:', e); }
  }

  function toggleSelect(id, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (selectedRecipes.has(id)) selectedRecipes.delete(id);
    else selectedRecipes.add(id);
    saveSelected();
    // Cập nhật trạng thái nút + card mà không re-render hết
    document.querySelectorAll(`[data-select-id="${id}"]`).forEach(el => {
      el.classList.toggle('active', selectedRecipes.has(id));
    });
    document.querySelectorAll(`.recipe-card[data-id="${id}"]`).forEach(card => {
      card.classList.toggle('selected', selectedRecipes.has(id));
    });
    updateShoppingBar();
  }

  function clearSelected() {
    selectedRecipes.clear();
    saveSelected();
    document.querySelectorAll('.select-btn.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.recipe-card.selected').forEach(el => el.classList.remove('selected'));
    updateShoppingBar();
  }

  function updateShoppingBar() {
    const bar = document.getElementById('shoppingBar');
    const count = selectedRecipes.size;
    if (count > 0) {
      bar.classList.add('show');
      document.getElementById('shoppingBarCount').textContent = count;
    } else {
      bar.classList.remove('show');
    }
  }

  function toggleFavorite(id, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveFavorites();
    renderGrid();
    // re-render sidebar nếu đang mở để cập nhật count "Đã lưu"
    if (document.getElementById('sidebar').classList.contains('open')) renderSidebar();
    if (currentRecipe && currentRecipe.id === id) {
      // cập nhật nút trong modal mà không re-render hết (giữ scroll position)
      document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(el => {
        el.classList.toggle('active', favorites.has(id));
      });
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.panel === tab);
    });
  }

  function printRecipe() {
    if (!currentRecipe && !inShoppingMode) return;
    window.print();
  }

  // ========== SHOPPING LIST (TỔNG HỢP ĐI CHỢ) ==========
  function stripParenthetical(s) {
    return String(s || '').replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
  }

  function formatNumber(qty) {
    let display;
    if (qty >= 100) display = Math.round(qty).toString();
    else if (qty >= 10) display = (Math.round(qty * 10) / 10).toString();
    else if (qty >= 1) display = (Math.round(qty * 100) / 100).toString();
    else display = formatFraction(qty);
    display = display.replace(/\.?0+$/, '');
    if (display === '' || display === '-') display = '0';
    return display;
  }

  function buildShoppingList() {
    // Gom nguyên liệu theo (tên đã strip ngoặc + đơn vị)
    // Lưu giữ: qty cộng dồn (cùng đơn vị), có "vừa đủ" (qty null) không, nguồn từ món nào
    const map = new Map();
    const usedRecipes = [];

    [...selectedRecipes].forEach(id => {
      const r = RECIPES.find(x => x.id === id);
      if (!r) return;
      usedRecipes.push(r);
      r.groups.forEach(g => {
        g.items.forEach(item => {
          if (!item.name) return;
          const cleanName = stripParenthetical(item.name);
          if (!cleanName) return;
          const nameKey = cleanName.toLowerCase();
          const unitKey = (item.unit || '').toLowerCase();
          const key = nameKey + '||' + unitKey;
          if (!map.has(key)) {
            map.set(key, {
              name: cleanName,
              unit: item.unit,
              qty: 0,
              hasQty: false,
              hasOpen: false,
              sources: new Set()
            });
          }
          const entry = map.get(key);
          entry.sources.add(r.title);
          if (item.qty === null || item.qty === undefined) {
            entry.hasOpen = true;
          } else {
            entry.hasQty = true;
            entry.qty += Number(item.qty) || 0;
          }
        });
      });
    });

    // Merge các entry CÙNG tên gốc nhưng KHÁC đơn vị: gộp các đơn vị lại 1 dòng
    const byName = new Map();
    map.forEach(entry => {
      const k = entry.name.toLowerCase();
      if (!byName.has(k)) byName.set(k, { name: entry.name, units: [], sources: new Set() });
      const merged = byName.get(k);
      entry.sources.forEach(s => merged.sources.add(s));
      merged.units.push({
        qty: entry.qty,
        unit: entry.unit,
        hasQty: entry.hasQty,
        hasOpen: entry.hasOpen
      });
    });

    // Sort theo tên (vi locale)
    const items = [...byName.values()].sort((a, b) =>
      a.name.localeCompare(b.name, 'vi', { sensitivity: 'base' })
    );

    return { items, recipes: usedRecipes };
  }

  function formatShoppingQty(units) {
    // units: [{qty, unit, hasQty, hasOpen}, ...]
    const parts = [];
    units.forEach(u => {
      if (u.hasQty && u.qty > 0) {
        parts.push(`${formatNumber(u.qty)} ${u.unit}`);
      } else if (u.hasOpen) {
        // "vừa đủ" hoặc "nêm vừa ăn"
        parts.push(u.unit || 'vừa đủ');
      }
    });
    return parts.length > 0 ? parts.join(' · ') : '—';
  }

  // ========== UTILITIES ==========
  function formatQty(qty, unit, baseServings, currentServings) {
    if (qty === null || qty === undefined) {
      return unit; // "vừa đủ", "nêm vừa ăn"
    }
    const scaled = qty * (currentServings / baseServings);

    // Format number nicely
    let display;
    if (scaled >= 100) {
      display = Math.round(scaled).toString();
    } else if (scaled >= 10) {
      display = (Math.round(scaled * 10) / 10).toString();
    } else if (scaled >= 1) {
      display = (Math.round(scaled * 100) / 100).toString();
    } else {
      // Fractions for small amounts
      display = formatFraction(scaled);
    }

    // Remove trailing zeros
    display = display.replace(/\.?0+$/, '');
    if (display === '' || display === '-') display = '0';

    return `${display} ${unit}`;
  }

  function formatFraction(n) {
    // Common fractions
    if (Math.abs(n - 0.5) < 0.02) return '½';
    if (Math.abs(n - 0.25) < 0.02) return '¼';
    if (Math.abs(n - 0.33) < 0.02) return '⅓';
    if (Math.abs(n - 0.67) < 0.02) return '⅔';
    if (Math.abs(n - 0.75) < 0.02) return '¾';
    if (Math.abs(n - 0.125) < 0.02) return '⅛';
    return (Math.round(n * 100) / 100).toString();
  }

  // ========== HELPERS ==========
  const FAV_KEY_FILTER = 'favorites';
  const ALL_KEY_FILTER = 'all';
  const ROMAN_NUMERALS = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];

  function slugify(s) {
    return String(s).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Lấy danh sách category theo thứ tự xuất hiện trong RECIPES
  function getOrderedCategories() {
    const seen = new Set();
    const list = [];
    RECIPES.forEach(r => {
      if (!seen.has(r.category)) { seen.add(r.category); list.push(r.category); }
    });
    return list;
  }

  function filterRecipes() {
    return RECIPES.filter(r => {
      let matchCat = true;
      if (activeCategory === FAV_KEY_FILTER) matchCat = favorites.has(r.id);
      // categoryName filter: lọc theo tên category cụ thể (không dùng cho sidebar — sidebar chỉ scroll)
      const q = searchQuery.toLowerCase();
      const matchSearch = !q || r.title.toLowerCase().includes(q) ||
                          (r.subtitle && r.subtitle.toLowerCase().includes(q));
      return matchCat && matchSearch;
    });
  }

  function renderGrid() {
    const grid = document.getElementById('recipeGrid');
    const filtered = filterRecipes();

    if (filtered.length === 0) {
      const msg = activeCategory === FAV_KEY_FILTER
        ? 'Chưa có món nào được lưu — bấm trái tim ♡ trên món yêu thích để lưu lại'
        : 'Không tìm thấy món nào…';
      grid.innerHTML = `<div class="empty">${msg}</div>`;
      bindCardEvents(grid);
      return;
    }

    // Group filtered theo category, giữ thứ tự xuất hiện
    const groups = {};
    const order = [];
    filtered.forEach(r => {
      if (!groups[r.category]) { groups[r.category] = []; order.push(r.category); }
      groups[r.category].push(r);
    });

    grid.innerHTML = order.map((cat, idx) => `
      <section class="recipe-section" id="section-${slugify(cat)}">

      card.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.fav-btn') && !e.target.closest('.select-btn')) {
          e.preventDefault();
          openModal(parseInt(card.dataset.id));

    grid.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', e => toggleFavorite(parseInt(btn.dataset.favId), e));

    grid.querySelectorAll('.select-btn').forEach(btn => {

  // ========== MODAL ==========

  function adjustServings(delta) {

  function renderIngredients(r) {

            <li class="ingredient">
              <span class="ingredient-name">
                ${item.name}
                ${item.note ? `<span class="ingredient-note">(${item.note})</span>` : ''}
              </span>
              <span class="ingredient-qty ${isScaled && item.qty !== null ? 'scaled' : ''}">
                ${formatQty(item.qty, item.unit, r.servings, currentServings)}

  // ========== STEP TIMER ==========
  // Phân tích chuỗi thời gian tiếng Việt thành số giây.
  // Hỗ trợ: "~30 phút", "~2 giờ", "~1 giờ 30 phút", "~15-20 phút" (lấy số đầu),
  // "~5 phút/mẻ", "~30 phút (nghỉ bột)".
  function parseTimeToSeconds(str) {
    if (!str) return 0;
    let s = String(str).toLowerCase();
    let total = 0;
    // Decimal trước (ưu tiên "1.5 giờ" trước khi match "5 giờ")
    const decH = s.match(/(\d+)[.,](\d+)\s*giờ/);
    if (decH) {
      total += Math.round((parseInt(decH[1],10)+parseFloat('0.'+decH[2]))*3600);
      s = s.replace(decH[0], '');
    }
    const decM = s.match(/(\d+)[.,](\d+)\s*phút/);
    if (decM) {
      total += Math.round((parseInt(decM[1],10)+parseFloat('0.'+decM[2]))*60);
      s = s.replace(decM[0], '');
    }
    const hMatch = s.match(/(\d+)\s*(?:-\s*\d+\s*)?giờ/);
    if (hMatch) total += parseInt(hMatch[1], 10) * 3600;
    const mMatch = s.match(/(\d+)\s*(?:-\s*\d+\s*)?phút/);
    if (mMatch) total += parseInt(mMatch[1], 10) * 60;
    const secMatch = s.match(/(\d+)\s*(?:-\s*\d+\s*)?giây/);
    if (secMatch) total += parseInt(secMatch[1], 10);
    return total;
  }

  function formatTime(sec) {
    if (sec < 0) sec = 0;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // Lưu các interval đang chạy để dọn khi đóng modal
  const activeTimerIntervals = new Set();

  function clearAllTimers() {
    activeTimerIntervals.forEach(id => clearInterval(id));
    activeTimerIntervals.clear();
    if (typeof timerAlarm !== 'undefined') timerAlarm.stop();
  }

  function toggleStepTimer(chipEl) {
    const step = chipEl.closest('.step');
    const panel = step.querySelector('.step-timer');
    if (!panel) return;
    stopTimerAlarm();
    const willOpen = !panel.classList.contains('open');
    panel.classList.toggle('open');
    chipEl.classList.toggle('active', willOpen);
  }

  function startStepTimer(btn) {
    const panel = btn.closest('.step-timer');
    stopTimerAlarm();
    if (panel.dataset.state === 'running') return;
    let remaining = parseInt(panel.dataset.remaining, 10);
    if (!remaining || remaining <= 0) {
      remaining = parseInt(panel.dataset.duration, 10);
      panel.dataset.remaining = remaining;
    }
    panel.dataset.state = 'running';
    panel.classList.add('running');
    panel.classList.remove('done');
    const display = panel.querySelector('.step-timer-display');
    const interval = setInterval(() => {
      remaining--;
      panel.dataset.remaining = remaining;
      display.textContent = formatTime(remaining);
      if (remaining <= 0) {
        clearInterval(interval);
        activeTimerIntervals.delete(interval);
        panel.classList.remove('running');
        panel.classList.add('done');
        panel.dataset.state = 'done';
        playTimerBeep();
      }
    }, 1000);
    activeTimerIntervals.add(interval);
    panel.dataset.intervalId = interval;
  }

  function pauseStepTimer(btn) {
    const panel = btn.closest('.step-timer');
    stopTimerAlarm();
    if (panel.dataset.state !== 'running') return;
    const id = parseInt(panel.dataset.intervalId, 10);
    clearInterval(id);
    activeTimerIntervals.delete(id);
    panel.dataset.state = 'paused';
    panel.classList.remove('running');
  }

  function resetStepTimer(btn) {
    const panel = btn.closest('.step-timer');
    stopTimerAlarm();
    const id = parseInt(panel.dataset.intervalId, 10);
    if (id) {
      clearInterval(id);
      activeTimerIntervals.delete(id);
    }
    const duration = parseInt(panel.dataset.duration, 10);
    panel.dataset.state = 'idle';
    panel.dataset.remaining = duration;
    panel.classList.remove('running', 'done');
    panel.querySelector('.step-timer-display').textContent = formatTime(duration);
  }

  function addStepTime(btn, delta) {
    const panel = btn.closest('.step-timer');
    stopTimerAlarm();
    let remaining = parseInt(panel.dataset.remaining, 10) || 0;
    let duration = parseInt(panel.dataset.duration, 10) || 0;
    remaining = Math.max(0, remaining + delta);
    duration = Math.max(0, duration + delta);
    panel.dataset.remaining = remaining;
    panel.dataset.duration = duration;
    if (panel.classList.contains('done') && remaining > 0) {
      panel.classList.remove('done');
      panel.dataset.state = 'idle';
    }
    panel.querySelector('.step-timer-display').textContent = formatTime(remaining);
  }

  // Chuông báo + rung liên tục cho đến khi gọi stop()
  const timerAlarm = {
    ctx: null,
    intervalId: null,
    canVibrate: typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function',
    start() {
      this.stop();
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (Ctor) {
          this.ctx = new Ctor();
          const playOne = () => {
            if (!this.ctx) return;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g); g.connect(this.ctx.destination);
            o.type = 'sine';
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.25, this.ctx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);
            o.start();
            o.stop(this.ctx.currentTime + 0.4);
          };
          playOne();
          this.intervalId = setInterval(() => {
            playOne();
            if (this.canVibrate) {
              try { navigator.vibrate([300, 200, 300]); } catch (e) {}
            }
          }, 800);
        }
        // rung lần đầu ngay khi bắt đầu
        if (this.canVibrate) {
          try { navigator.vibrate([300, 200, 300]); } catch (e) {}
        }
      } catch (e) { /* trình duyệt chưa cho phép audio - bỏ qua */ }
    },
    stop() {
      if (this.intervalId) {
        clearInterval(this.intervalId);
        this.intervalId = null;
      }
      if (this.ctx) {
        try { this.ctx.close(); } catch (e) {}
        this.ctx = null;
      }
      if (this.canVibrate) {
        try { navigator.vibrate(0); } catch (e) {}
      }
    }
  };

  function playTimerBeep() {
    timerAlarm.start();
  }

  function stopTimerAlarm() {
    timerAlarm.stop();
    document.querySelectorAll('.step-timer.done').forEach(p => p.classList.remove('done'));
  }

  function renderSteps(r) {
    return r.steps.map((s, i) => {
      const seconds = s.time ? parseTimeToSeconds(s.time) : 0;
      const hasTimer = seconds > 0;
      const timeChip = s.time
        ? `<span class="step-time${hasTimer ? ' has-timer' : ''}"${hasTimer ? ` onclick="toggleStepTimer(this)" role="button" tabindex="0" title="Bấm để bật bộ đếm giờ"` : ''}>${s.time}</span>`
        : '';
      const timerPanel = hasTimer ? `
            <div class="step-timer" data-duration="${seconds}" data-remaining="${seconds}" data-state="idle">
              <span class="step-timer-display">${formatTime(seconds)}</span>
              <button class="step-timer-btn" onclick="startStepTimer(this)">▶ Bắt đầu</button>
              <button class="step-timer-btn" onclick="pauseStepTimer(this)">⏸ Dừng</button>
              <button class="step-timer-btn reset" onclick="resetStepTimer(this)">↻ Đặt lại</button>
              <button class="step-timer-add" onclick="addStepTime(this,60)" title="Thêm 1 phút">+1'</button>
              <button class="step-timer-add" onclick="addStepTime(this,-60)" title="Bớt 1 phút">−1'</button>
            </div>` : '';
      return `
      <div class="step">
        <div class="step-num">${String(i + 1).padStart(2, '0')}</div>
        <div class="step-body">
          <h4 class="step-title">
            ${s.title}
            ${timeChip}
          </h4>
          <p class="step-content">${s.content}</p>
          ${timerPanel}
        </div>
      </div>
    `;
    }).join('');
  }

  function renderModal() {
    const r = currentRecipe;
    const isScaled = currentServings !== r.servings;
    const isFav = favorites.has(r.id);
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <div class="modal-sticky-bar">
        <button class="icon-btn" onclick="closeModal()" aria-label="Đóng" title="Đóng">←</button>
        <h3 class="modal-sticky-title">${r.title}</h3>
        <div class="modal-actions">
          <button class="icon-btn fav ${isFav ? 'active' : ''}" data-fav-id="${r.id}" onclick="toggleFavorite(${r.id}, event)" aria-label="${isFav ? 'Bỏ lưu' : 'Lưu món'}" title="${isFav ? 'Bỏ lưu' : 'Lưu món'}">${isFav ? '❤' : '♡'}</button>
          <button class="icon-btn" onclick="printRecipe()" aria-label="In công thức" title="In công thức">⎙</button>
        </div>
      </div>

      <header class="recipe-header">
        <div class="recipe-num">№ ${String(r.id).padStart(2, '0')} · ${r.category}</div>
        <h2 class="recipe-title">${r.title}</h2>
        ${r.subtitle ? `<div class="recipe-subtitle">${r.subtitle}</div>` : ''}
        ${r.author ? `<div class="recipe-author">Tác giả · ${r.author}</div>` : ''}
        <div class="recipe-meta">
          <span>Nguồn · ${r.source}</span>
          <span>${r.groups.length} phần nguyên liệu</span>
          <span>${r.steps.length} bước</span>
        </div>
      </header>

      <div class="servings-control">
        <span class="servings-label">Khẩu phần cho</span>
        <div class="servings-control-buttons">
          <button class="servings-btn" onclick="adjustServings(-1)" ${currentServings <= 1 ? 'disabled' : ''}>−</button>
          <div class="servings-value">${currentServings}</div>
          <button class="servings-btn" onclick="adjustServings(1)" ${currentServings >= 30 ? 'disabled' : ''}>+</button>
        </div>
        <span class="servings-unit">${isScaled ? `người (gốc: ${r.servings})` : 'người'}</span>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn ${currentTab === 'ingredients' ? 'active' : ''}" data-tab="ingredients" onclick="switchTab('ingredients')">Nguyên liệu</button>
        <button class="tab-btn ${currentTab === 'steps' ? 'active' : ''}" data-tab="steps" onclick="switchTab('steps')">Cách làm</button>
      </div>

      <div class="recipe-content">
        <div class="tab-panel ${currentTab === 'ingredients' ? 'active' : ''}" data-panel="ingredients">
          <h2 class="print-only-title">Nguyên liệu</h2>
          ${renderIngredients(r)}
        </div>
        <div class="tab-panel ${currentTab === 'steps' ? 'active' : ''}" data-panel="steps">
          <h2 class="print-only-title">Cách làm</h2>
          ${renderSteps(r)}
        </div>
      </div>
    `;

    // Scroll modal to top + bind scroll listener for sticky title fade
    const scrollEl = document.getElementById('modalContent');
    scrollEl.scrollTop = 0;
    scrollEl.classList.remove('scrolled');
    scrollEl.onscroll = () => {
      scrollEl.classList.toggle('scrolled', scrollEl.scrollTop > 80);
    };
  }

  // ========== EVENT HANDLERS ==========
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderGrid();
  });

  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('sidebar').classList.contains('open')) closeSidebar();
      else closeModal();
    }
  });

  // ========== INIT ==========
  document.getElementById('recipeCount').textContent = RECIPES.length + ' món';
  renderGrid();
  updateShoppingBar();
</script>
</body>
</html>
